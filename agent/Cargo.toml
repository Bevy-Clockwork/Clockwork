[package]
name = "clockwork_agent"
description = "MCP server and tools for Clockwork's extraction agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "clockwork-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.23"
clockwork_core.workspace = true
clockwork_gba.workspace = true
clockwork_library.workspace = true
clockwork_n64.workspace = true
clockwork_platforms.workspace = true
clockwork_recipe.workspace = true
image.workspace = true
regex = "1"
rmcp = { version = "3.6", features = ["server", "transport-io", "macros", "schemars", "transport-streamable-http-server"] }
ron.workspace = true
schemars = "1"
serde.workspace = true
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net"] }
toml.workspace = true
