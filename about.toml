# Generate notices for the shipped Windows binaries from the locked dependency graph.
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "CC0-1.0", "Unlicense", "Unicode-3.0", "OFL-1.1", "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "Ubuntu-font-1.0", "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true

# The unmodified source archive is linked per version in the generated notices.
[option-ext]
accepted = ["MPL-2.0"]
